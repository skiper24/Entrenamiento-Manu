<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Mi entrenamiento</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf0f8;background:#0c1220}*{box-sizing:border-box}body{margin:0;padding:0 0 90px}header{padding:25px 18px 12px;max-width:760px;margin:auto}h1{margin:0;font-size:26px}h2{font-size:19px}small,.muted{color:#9aa9c0}main{max-width:760px;margin:auto;padding:0 14px}.tabs{display:flex;gap:6px;position:sticky;top:0;background:#0c1220;padding:10px 14px;z-index:2;overflow:auto}.tabs button{flex:1;min-width:78px}.card{background:#182235;border:1px solid #2d3a50;border-radius:16px;padding:15px;margin:12px 0}button,select,input{font:inherit}button{background:#27364c;color:#eef4ff;border:1px solid #3d4e66;border-radius:10px;padding:10px;cursor:pointer}button.active,.primary{background:#6c9dff;color:#071325;border-color:#6c9dff;font-weight:700}button.danger{color:#ffb7b7}input,select{background:#0e1728;color:white;border:1px solid #42536c;border-radius:8px;padding:9px;min-width:0;width:100%}label{font-size:12px;color:#b4c2d5;display:block;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.line{display:flex;gap:8px;align-items:center;justify-content:space-between}.line>*{min-width:0}.sets{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:7px;align-items:center;margin:8px 0}.sets input[type=checkbox]{height:22px}.pill{display:inline-block;border:1px solid #465b7b;border-radius:99px;padding:4px 9px;font-size:12px;color:#b9d0ff}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.exname{font-weight:700;margin:0 0 5px}svg{width:100%;height:180px}.note{font-size:12px;line-height:1.5;color:#9faec3}.wide{width:100%}a{color:#a9c6ff}#toast{position:fixed;bottom:15px;left:10%;right:10%;text-align:center;background:#2b466a;padding:10px;border-radius:10px;display:none;z-index:9}@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><header><small>REGISTRO DE FUERZA E HIPERTROFIA</small><h1>Mi entrenamiento 💪</h1><p class="muted">4 días · prioridad torso · datos en este dispositivo</p></header><div class="tabs"><nav style="width:100%"><button data-tab="today" class="active">Entrenar</button><button data-tab="history">Historial</button><button data-tab="progress">Progreso</button><button data-tab="settings">Ajustes</button></nav></div><main id="app"></main><div id="toast"></div><script>
const KEY='manuel_gym_v1';
const base=[
{name:'Torso A · Pecho',ex:[['Press de banca con barra',3,'5-8','45-50'],['Dominadas libres',3,'4-6','0'],['Press inclinado con mancuernas',3,'8-10','15'],['Remo con barra',3,'8-10','25'],['Vuelos laterales',3,'12-15','6'],['Press francés con barra',2,'10-12','20'],['Curl predicador con barra',2,'8-12','20-25']]},
{name:'Piernas A · Cuádriceps',ex:[['Sentadilla con barra',3,'5-8','50-60'],['Prensa',3,'10-12','100'],['Extensiones de cuádriceps',2,'12-15','35'],['Curl femoral en camilla',3,'10-12','40'],['Aductores',2,'12-15','40'],['Gemelos en máquina',3,'10-15','']]},
{name:'Torso B · Espalda',ex:[['Dominadas libres',3,'4-6','0'],['Remo con mancuerna apoyado',3,'8-12','12.5'],['Press de banca con barra',3,'8-10','40-45'],['Dorsalera',2,'10-12','30-35'],['Aperturas en máquina',2,'10-15','50'],['Curl predicador con barra',2,'8-12','20-25'],['Curl martillo',2,'10-12','10'],['Extensión de tríceps en polea',2,'10-15','']]},
{name:'Piernas B · Posterior',ex:[['Peso muerto rumano',3,'6-10','30-40'],['Sentadilla en Smith',3,'8-10',''],['Curl femoral en camilla',3,'10-12','40'],['Zancadas con mancuernas',2,'10 por pierna','6-10'],['Gemelos en máquina',3,'12-15',''],['Plancha',3,'30-45 s','0']]}
];
const defaults=()=>({days:base.map(d=>({name:d.name,ex:d.ex.map(e=>({name:e[0],count:e[1],target:e[2],hint:e[3]}))})),sessions:[],drafts:{}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||defaults();if(!Array.isArray(db.days)||!Array.isArray(db.sessions))throw 0}catch{db=defaults()};let tab='today',day=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('No se pudo guardar. Exportá tus datos y verificá el almacenamiento del navegador.')}}
function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function latest(name){for(let i=db.sessions.length-1;i>=0;i--){let e=db.sessions[i].ex.find(x=>x.name===name);if(e)return e}return null}
function draft(){if(!db.drafts[day])db.drafts[day]={date:new Date().toISOString().slice(0,10),ex:db.days[day].ex.map(e=>{let old=latest(e.name);return {name:e.name,sets:Array.from({length:e.count},(_,i)=>({kg:old?.sets[i]?.kg??(String(e.hint).match(/^\d+(?:\.\d+)?/)||[''])[0],reps:'',done:false}))}})};return db.drafts[day]}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let a=$('#app');if(tab==='today'){
let d=draft();a.innerHTML=`<div class="card"><label>Día de entrenamiento</label><select id="day">${db.days.map((x,i)=>`<option value="${i}" ${day===i?'selected':''}>Día ${i+1} · ${esc(x.name)}</option>`).join('')}</select><label>Fecha</label><input id="date" type="date" value="${esc(d.date)}"></div>${d.ex.map((e,ei)=>{let cfg=db.days[day].ex[ei];return `<section class="card"><p class="exname">${ei+1}. ${esc(e.name)}</p><span class="pill">${cfg.count} series · ${esc(cfg.target)} reps</span> <small>Referencia: ${esc(cfg.hint||'a determinar')} kg</small><p class="note">Último registro: ${latest(e.name)?latest(e.name).sets.map(s=>esc(s.kg)+' kg × '+esc(s.reps)).join(' · '):'sin registros'}</p><div class="sets"><small>#</small><small>kg</small><small>reps</small><small>✓</small></div>${e.sets.map((s,si)=>`<div class="sets"><b>${si+1}</b><input type="number" inputmode="decimal" step="0.5" min="0" data-e="${ei}" data-s="${si}" data-f="kg" value="${esc(s.kg)}"><input type="number" inputmode="numeric" min="0" data-e="${ei}" data-s="${si}" data-f="reps" value="${esc(s.reps)}"><input type="checkbox" data-e="${ei}" data-s="${si}" data-f="done" ${s.done?'checked':''}></div>`).join('')}</section>`}).join('')}<button id="finish" class="primary wide">Guardar entrenamiento terminado</button><p class="note">Los cambios se guardan automáticamente como borrador. Marcá las series realizadas y completá sus repeticiones.</p>`;
$('#day').onchange=e=>{day=+e.target.value;render()};$('#date').onchange=e=>{draft().date=e.target.value;save()};a.querySelectorAll('[data-e]').forEach(el=>el.onchange=()=>{let s=draft().ex[+el.dataset.e].sets[+el.dataset.s];s[el.dataset.f]=el.dataset.f==='done'?el.checked:el.value;save()});$('#finish').onclick=()=>{let x=draft();if(!x.ex.some(e=>e.sets.some(s=>s.done&&s.reps!==''))){alert('Marcá al menos una serie completada y cargá sus repeticiones.');return}let entry=structuredClone({id:Date.now(),date:x.date,day:day,dayName:db.days[day].name,ex:x.ex.map(e=>({...e,sets:e.sets.filter(s=>s.done&&s.reps!=='')})).filter(e=>e.sets.length)});db.sessions.push(entry);delete db.drafts[day];save();toast('Entrenamiento guardado');tab='history';render()};
}else if(tab==='history'){a.innerHTML=`<h2>Historial de sesiones</h2>${db.sessions.length?db.sessions.slice().reverse().map(s=>`<section class="card"><div class="line"><strong>${esc(s.dayName)}</strong><small>${esc(s.date)}</small></div>${s.ex.map(e=>`<p class="note"><b>${esc(e.name)}</b>: ${e.sets.map(x=>esc(x.kg)+' kg × '+esc(x.reps)).join(' · ')}</p>`).join('')}<button class="danger" data-del="${s.id}">Eliminar sesión</button></section>`).join(''):'<p class="muted">Todavía no registraste entrenamientos.</p>'}`;a.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar esta sesión del historial?')){db.sessions=db.sessions.filter(s=>s.id!==+b.dataset.del);save();render()}});
}else if(tab==='progress'){let names=[...new Set(db.days.flatMap(d=>d.ex.map(e=>e.name)))];a.innerHTML=`<h2>Progresión</h2><div class="card"><label>Ejercicio</label><select id="exercise">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select><div id="chart"></div></div><p class="note">Gráfico del mejor peso registrado por sesión (kg). Para dominadas sin lastre, usá el historial de repeticiones; el gráfico de kilos no refleja la mejora en repeticiones.</p>`;$('#exercise').onchange=chart;chart();
}else{a.innerHTML=`<h2>Ajustes y datos</h2><div class="card"><h3>Exportación y copia de seguridad</h3><p class="note">Exportá un JSON con tus rutinas, sesiones e historial. Guardalo en Archivos o iCloud Drive. Los datos locales pueden perderse si borrás los datos del navegador.</p><button id="export" class="primary">Exportar JSON</button> <button id="csv">Exportar CSV</button><label>Restaurar una copia JSON</label><input id="import" type="file" accept=".json,application/json"></div><div class="card"><h3>Editar ejercicios</h3><label>Día</label><select id="editday">${db.days.map((d,i)=>`<option value="${i}">${esc(d.name)}</option>`).join('')}</select><div id="editor"></div></div><div class="card"><button class="danger" id="reset">Borrar todos los datos</button></div>`;$('#export').onclick=()=>download('mi-entrenamiento-backup.json',JSON.stringify(db,null,2),'application/json');$('#csv').onclick=()=>{let lines=[['fecha','dia','ejercicio','serie','kg','repeticiones']];db.sessions.forEach(s=>s.ex.forEach(e=>e.sets.forEach((x,i)=>lines.push([s.date,s.dayName,e.name,i+1,x.kg,x.reps]))));download('mi-entrenamiento-historial.csv','\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('#import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.days)||!Array.isArray(v.sessions))throw Error();if(confirm('¿Reemplazar tus datos actuales por los de esta copia?')){db={days:v.days,sessions:v.sessions,drafts:v.drafts||{}};save();render();toast('Copia restaurada')}}catch{alert('Archivo JSON no válido')}};$('#editday').onchange=editor;editor();$('#reset').onclick=()=>{if(confirm('¿Borrar definitivamente rutinas personalizadas e historial? Exportá antes una copia.')){db=defaults();save();render()}}}
}
function editor(){let i=+$('#editday').value;$('#editor').innerHTML=db.days[i].ex.map((e,j)=>`<div class="card"><label>Ejercicio ${j+1}</label><input data-edit="name" data-i="${j}" value="${esc(e.name)}"><div class="grid"><div><label>Series</label><input type="number" min="1" max="12" data-edit="count" data-i="${j}" value="${e.count}"></div><div><label>Reps</label><input data-edit="target" data-i="${j}" value="${esc(e.target)}"></div><div><label>Kg ref.</label><input data-edit="hint" data-i="${j}" value="${esc(e.hint)}"></div></div><button data-remove="${j}" class="danger">Quitar</button></div>`).join('')+'<button id="add">+ Agregar ejercicio</button>';$('#editor').querySelectorAll('[data-edit]').forEach(el=>el.onchange=()=>{let x=db.days[i].ex[+el.dataset.i];x[el.dataset.edit]=el.dataset.edit==='count'?Math.max(1,Math.min(12,+el.value||1)):el.value;delete db.drafts[i];save()});$('#editor').querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{if(confirm('¿Quitar este ejercicio de la rutina? El historial anterior se conserva.')){db.days[i].ex.splice(+el.dataset.remove,1);delete db.drafts[i];save();editor()}});$('#add').onclick=()=>{db.days[i].ex.push({name:'Nuevo ejercicio',count:3,target:'8-12',hint:''});delete db.drafts[i];save();editor()}}
function chart(){let n=$('#exercise').value;let points=db.sessions.filter(s=>s.ex.some(e=>e.name===n)).map(s=>({date:s.date,value:Math.max(...s.ex.find(e=>e.name===n).sets.map(x=>+x.kg||0))}));if(!points.length){$('#chart').innerHTML='<p class="muted">Sin registros todavía para este ejercicio.</p>';return}let max=Math.max(1,...points.map(p=>p.value));let coords=points.map((p,i)=>[30+(i*(300/Math.max(1,points.length-1))),160-(p.value/max)*125]);$('#chart').innerHTML=`<svg viewBox="0 0 360 190" role="img" aria-label="Evolución del peso"><path d="M30 15 V160 H345" fill="none" stroke="#60738d"/><polyline points="${coords.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#8db6ff" stroke-width="3"/>${coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#b5d2ff"><title>${esc(points[i].date)}: ${points[i].value} kg</title></circle>`).join('')}<text x="32" y="12" fill="#b5c4dc" font-size="12">${max} kg</text><text x="30" y="180" fill="#b5c4dc" font-size="11">${esc(points[0].date)}</text><text x="345" y="180" text-anchor="end" fill="#b5c4dc" font-size="11">${esc(points.at(-1).date)}</text></svg><p class="note">Última sesión: ${points.at(-1).value} kg · ${points.length} sesiones registradas</p>`}
function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script></body></html>
